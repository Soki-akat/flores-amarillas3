<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8"> 
<title>Flores Amarillas 🌻</title> 
 
<style> 
body{ 
  margin:0; 
  height:100vh; 
  overflow:hidden; 
  background:#fff8d6; 
  font-family:Arial; 
  text-align:center; 
} 
 
.contenido{ 
  position:relative; 
  z-index:2; 
  top:10%; 
} 
 
img{ 
  width:280px; 
  border-radius:20px; 
  box-shadow:0 5px 20px #999; 
} 
 
h1{color:#e6a800} 
 
.flor{ 
  position:absolute; 
  font-size:35px; 
  animation:flotar 8s linear infinite; 
} 
 
@keyframes flotar{ 
  0%{ 
    transform:translateY(100vh) rotate(0deg); 
    opacity:0; 
  } 
  20%{opacity:1;} 
  100%{ 
    transform:translateY(-120vh) rotate(360deg); 
    opacity:0; 
  } 
} 
</style> 
</head> 
 
<body> 
 
<div class="contenido"> 
  <img src="foto.jpg">
  <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1> 
  <p>Para alguien muy especial 💛</p> 
</div> 
 
<script> 
for(let i=0;i<20;i++){ 
  let flor=document.createElement("div"); 
  flor.className="flor"; 
  flor.innerHTML="🌻"; 
  flor.style.left=Math.random()*100+"%"; 
  flor.style.animationDuration=(5+Math.random()*6)+"s"; 
  flor.style.animationDelay=Math.random()*5+"s"; 
  document.body.appendChild(flor); 
} 
</script> 
 
</body> 
</html>
